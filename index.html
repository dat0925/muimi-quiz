(function(){
  "use strict";

  const stage = document.getElementById('stage');
  const curEl = document.getElementById('cur');
  const totalEl = document.getElementById('total');
  const barEl = document.getElementById('bar');
  const modeLabel = document.getElementById('mode-label');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const shuffleBtn = document.getElementById('shuffle');

  let order = QUIZ.map((_, i) => i);
  let pos = 0;
  let shuffled = false;

  totalEl.textContent = QUIZ.length;

  function buildCard(item){
    const card = document.createElement('article');
    card.className = item.type === 'trick' ? 'card trick' : 'card';
    card.innerHTML = `
      <div class="plate">第 ${item.id} 問</div>
      <h2>${escapeHtml(item.title)}<span class="q-suffix">QUESTION</span></h2>
      <div class="emoji" aria-hidden="true">${item.emoji}</div>
      <div class="divider"><span>問 題</span></div>
      <p class="question"><span class="lead-mark">問.</span>${escapeHtml(item.question)}</p>
      <button class="reveal-btn" type="button">答えを見る</button>
      <div class="answer" aria-live="polite">
        <div class="a-label">ANSWER</div>
        <div class="a-text">${escapeHtml(item.answer)}</div>
      </div>`;

    const btn = card.querySelector('.reveal-btn');
    const ans = card.querySelector('.answer');
    btn.addEventListener('click', function(){
      ans.classList.add('show');
      btn.disabled = true;
      btn.textContent = '答え合わせ完了';
      btn.style.filter = 'grayscale(.4) opacity(.75)';
    });
    return card;
  }

  function render(direction){
    const item = QUIZ[order[pos]];
    const card = buildCard(item);

    const old = stage.firstElementChild;
    if(old && direction){
      old.classList.add('swipe-anim');
      old.style.transform = `translateX(${direction < 0 ? '' : '-'}55%)`;
      old.style.opacity = '0';
      const removing = old;
      setTimeout(() => { if(removing.parentNode) removing.remove(); }, 260);
      // incoming card starts offset
      card.classList.add('swipe-anim');
      card.style.transform = `translateX(${direction < 0 ? '-' : ''}55%)`;
      card.style.opacity = '0';
      stage.appendChild(card);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
      }));
    } else {
      stage.innerHTML = '';
      stage.appendChild(card);
    }
    updateChrome();
  }

  function updateChrome(){
    curEl.textContent = pos + 1;
    barEl.style.width = ((pos + 1) / QUIZ.length * 100) + '%';
    prevBtn.disabled = pos === 0;
    nextBtn.disabled = pos === QUIZ.length - 1;
    modeLabel.textContent = shuffled ? '出題順：シャッフル' : '出題順：標準';
  }

  function go(delta){
    const target = pos + delta;
    if(target < 0 || target >= QUIZ.length) return;
    pos = target;
    render(delta > 0 ? 1 : -1);
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  shuffleBtn.addEventListener('click', function(){
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    shuffled = true;
    pos = 0;
    render(0);
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') go(-1);
    else if(e.key === 'ArrowRight') go(1);
  });

  // --- swipe (pointer: touch + mouse) ---
  let startX = 0, startY = 0, dragging = false, locked = false;

  stage.addEventListener('pointerdown', function(e){
    if(e.target.closest('.reveal-btn')) return;
    dragging = true; locked = false;
    startX = e.clientX; startY = e.clientY;
  });

  stage.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(!locked){
      if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if(Math.abs(dy) > Math.abs(dx)){ dragging = false; return; } // vertical scroll
      locked = true;
      const card = stage.firstElementChild;
      if(card) card.style.transition = 'none';
    }
    const card = stage.firstElementChild;
    if(card){
      const resist = ((pos === 0 && dx > 0) || (pos === QUIZ.length - 1 && dx < 0)) ? 0.3 : 1;
      card.style.transform = `translateX(${dx * resist}px) rotate(${dx * resist * 0.015}deg)`;
    }
  });

  function endDrag(e){
    if(!dragging){ return; }
    dragging = false;
    const card = stage.firstElementChild;
    if(!card){ return; }
    if(!locked){ return; }
    const dx = e.clientX - startX;
    card.style.transition = '';
    const threshold = Math.min(90, stage.offsetWidth * 0.22);
    if(dx <= -threshold && pos < QUIZ.length - 1){
      go(1);
    } else if(dx >= threshold && pos > 0){
      go(-1);
    } else {
      card.classList.add('swipe-anim');
      card.style.transform = 'translateX(0) rotate(0)';
      setTimeout(() => card.classList.remove('swipe-anim'), 280);
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', () => { dragging = false; });
  stage.addEventListener('pointerleave', function(e){ if(dragging) endDrag(e); });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  render(0);
})();
</script>
</body>
</html>
